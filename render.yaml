services:
  - type: web
    runtime: python
    name: otp-auth-api
    plan: free                     # bump when you outgrow it
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn wsgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      # Redis (Render Key Value) — auto-filled from the service below
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-otp
          property: connectionString


      - key: NATS_URL
        value: nats://nats-broker:4222

      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false               # you'll be prompted in the dashboard
      - key: SMTP_PASSWORD
        sync: false               # Gmail App Password, not account password

      - key: OTP_TTL_SECONDS
        value: "300"
      - key: MAX_OTP_ATTEMPTS
        value: "5"
      - key: NATS_OTP_REQUEST_TIMEOUT
        value: "20"
      - key: SMTP_RETRY_BACKOFF_SECONDS
        value: "2"

      - key: CORS_ORIGINS
        value: "*"                 # tighten to your real frontend origin(s)

  # ── NATS server (private service, no public URL) ───────────
  - type: pserv
    runtime: image
    name: nats-broker
    image:
      url: docker.io/library/nats:2.10-alpine

  # ── Redis (Render Key Value, managed) ───────────────────────
  - type: keyvalue
    name: redis-otp
    plan: free
    ipAllowList: []                
    maxmemoryPolicy: volatile-ttl  