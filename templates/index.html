<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link href="/static/styles.css" rel="stylesheet">
</head>
<body>

<div class="card">

  <!-- Step 1: Email -->
  <div class="step active" id="step-email">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your email to receive a one-time code.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />

    <div class="msg" id="email-msg"></div>

    <button class="btn" id="send-btn" onclick="sendOtp()">Send code</button>
  </div>

  <!-- Step 2: OTP -->
  <div class="step" id="step-otp">
    <h1>Check your email</h1>
    <p class="subtitle" id="otp-subtitle">We sent a 6-digit code to your email.</p>

    <label for="otp">One-time code</label>
    <input type="text" id="otp" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />

    <div class="msg" id="otp-msg"></div>

    <button class="btn" id="verify-btn" onclick="verifyOtp()">Verify</button>

    <div class="resend">
      Didn't get it? <button id="resend-btn" onclick="resend()">Resend</button>
    </div>

    <button class="back" onclick="goBack()">← Use a different email</button>
  </div>

  <!-- Step 3: Success -->
  <div class="step" id="step-done">
    <div class="verified-icon">✅</div>
    <h1 style="text-align:center">Verified</h1>
    <p class="subtitle" style="text-align:center;margin-top:0.375rem">
      You're signed in. A confirmation email is on its way.
    </p>
  </div>
  <script src="/static/scripts.js"></script>
</div>
</body>
</html>
